<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Triolet Al-Mahmood Musjid — Prayer Times</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #f6f1e4;
    --panel: #fffdf8;
    --ink: #1b2b28;
    --teal: #0f3d3e;
    --teal-2: #175c5b;
    --gold: #b8862b;
    --gold-light: #e4c983;
    --sand: #ece2c8;
    --muted: #6f7a72;
    --line: #ddd2ae;
    --shadow: rgba(15,61,62,0.12);
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0;
    padding:0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body{
    background-image:
      radial-gradient(circle at 15% 0%, rgba(184,134,43,0.08), transparent 40%),
      radial-gradient(circle at 90% 15%, rgba(15,61,62,0.06), transparent 45%);
    min-height: 100vh;
    padding: 32px 20px 60px;
  }

  .wrap{
    max-width: 920px;
    margin: 0 auto;
  }

  /* ---------- Top band ---------- */
  .masjid-name{
    text-align:center;
    font-family: 'Amiri', serif;
    font-weight: 700;
    font-size: clamp(1.4rem, 3.4vw, 2.05rem);
    color: var(--teal);
    letter-spacing: 0.3px;
    margin: 0 0 4px;
  }
  .masjid-sub{
    text-align:center;
    color: var(--muted);
    font-size: 0.85rem;
    margin: 0 0 28px;
  }

  /* ---------- Hero arch ---------- */
  .hero{
    position: relative;
    display:flex;
    justify-content:center;
    margin-bottom: 34px;
  }
  .arch{
    position: relative;
    width: min(100%, 560px);
    background: linear-gradient(180deg, var(--teal-2) 0%, var(--teal) 100%);
    border-top-left-radius: 260px;
    border-top-right-radius: 260px;
    border-bottom-left-radius: 18px;
    border-bottom-right-radius: 18px;
    padding: 46px 32px 30px;
    color: #fbf6e8;
    text-align: center;
    box-shadow: 0 18px 38px var(--shadow);
    overflow: hidden;
  }
  .arch::before{
    content:"";
    position:absolute;
    inset: 10px;
    border: 1px solid rgba(228,201,131,0.35);
    border-top-left-radius: 250px;
    border-top-right-radius: 250px;
    border-bottom-left-radius: 10px;
    border-bottom-right-radius: 10px;
    pointer-events:none;
  }
  .dates{
    display:flex;
    justify-content:center;
    gap:14px;
    flex-wrap:wrap;
    font-size: 0.82rem;
    color: var(--gold-light);
    letter-spacing: 0.3px;
    margin-bottom: 18px;
  }
  .dates span:not(:last-child)::after{
    content: "•";
    margin-left: 14px;
    color: rgba(251,246,232,0.35);
  }
  .next-label{
    font-size: 0.8rem;
    text-transform: none;
    color: rgba(251,246,232,0.72);
    margin-bottom: 6px;
  }
  .next-name{
    font-family: 'Amiri', serif;
    font-weight: 700;
    font-size: clamp(1.8rem, 5.5vw, 2.6rem);
    margin: 0 0 10px;
  }
  .countdown{
    font-variant-numeric: tabular-nums;
    font-size: clamp(2.1rem, 7vw, 3.1rem);
    font-weight: 600;
    letter-spacing: 1px;
    color: #fff;
  }
  .countdown small{
    display:block;
    font-size: 0.72rem;
    font-weight: 400;
    letter-spacing: 0.4px;
    color: rgba(251,246,232,0.75);
    margin-top: 6px;
  }
  .azan-iqamah{
    margin-top: 16px;
    display:flex;
    justify-content:center;
    gap: 26px;
    font-size: 0.85rem;
    color: rgba(251,246,232,0.85);
  }
  .azan-iqamah b{ color: var(--gold-light); font-weight:600; }

  /* ---------- Columns ---------- */
  .columns{
    display:grid;
    grid-template-columns: 1.1fr 0.9fr;
    gap: 20px;
  }
  @media (max-width: 680px){
    .columns{ grid-template-columns: 1fr; }
  }

  .panel{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    overflow: hidden;
  }
  .panel.tomorrow{
    opacity: 0.92;
  }

  .panel-head{
    padding: 16px 20px;
    display:flex;
    align-items: baseline;
    justify-content: space-between;
    background: var(--sand);
    border-bottom: 1px solid var(--line);
  }
  .panel.today .panel-head{
    background: var(--teal);
    color: #fbf6e8;
  }
  .panel-title{
    font-family:'Amiri', serif;
    font-weight: 700;
    font-size: 1.15rem;
  }
  .panel-date{
    font-size: 0.78rem;
    color: var(--muted);
  }
  .panel.today .panel-date{ color: rgba(251,246,232,0.75); }

  .row-list{
    padding: 6px 0;
  }
  .row{
    display:grid;
    grid-template-columns: 1fr auto auto;
    gap: 10px;
    align-items:center;
    padding: 11px 20px;
    border-bottom: 1px solid var(--line);
    font-size: 0.92rem;
  }
  .row:last-child{ border-bottom: none; }
  .row .name{
    font-weight: 600;
    color: var(--teal);
  }
  .row .col-label{
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--muted);
    display:block;
    margin-bottom: 1px;
  }
  .row .time{
    font-variant-numeric: tabular-nums;
    text-align: right;
    min-width: 62px;
  }
  .row.active{
    background: rgba(184,134,43,0.10);
  }
  .row.active .name{ color: var(--gold); }
  .row.sehri .name{ color: var(--muted); font-style: italic; font-weight:500; }

  .col-headers{
    display:grid;
    grid-template-columns: 1fr auto auto;
    gap:10px;
    padding: 8px 20px 2px;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--muted);
  }
  .col-headers span{ text-align:right; min-width:62px; }
  .col-headers span:first-child{ text-align:left; }

  .jumuah-strip{
    margin-top: 20px;
    display:flex;
    justify-content:center;
    gap: 26px;
    flex-wrap: wrap;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 20px;
    font-size: 0.88rem;
  }
  .jumuah-strip .jl{
    font-weight:600;
    color: var(--teal);
    margin-right: 6px;
  }

  .status-line{
    text-align:center;
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 22px;
  }
  .status-line button{
    margin-left: 8px;
    border: none;
    background: none;
    color: var(--gold);
    font-weight: 600;
    cursor: pointer;
    text-decoration: underline;
    font-size: 0.75rem;
  }

  .skeleton{
    text-align:center;
    color: rgba(251,246,232,0.8);
    padding: 20px 0 6px;
  }

  .error-box{
    max-width: 520px;
    margin: 0 auto 24px;
    background: #fdf1ea;
    border: 1px solid #e3b791;
    color: #7a3a12;
    padding: 14px 18px;
    border-radius: 12px;
    text-align:center;
    font-size: 0.88rem;
  }
</style>
</head>
<body>

<div class="wrap">
  <p class="masjid-name">Triolet Al-Mahmood Musjid</p>
  <p class="masjid-sub">Prayer &amp; Iqamah Times</p>

  <div id="error-slot"></div>

  <div class="hero">
    <div class="arch" id="arch">
      <div class="skeleton">Loading prayer times…</div>
    </div>
  </div>

  <div class="columns" id="columns" style="display:none;">
    <div class="panel today">
      <div class="panel-head">
        <span class="panel-title">Today</span>
        <span class="panel-date" id="today-date"></span>
      </div>
      <div class="col-headers"><span>Prayer</span><span>Begins</span><span>Jamah</span></div>
      <div class="row-list" id="today-rows"></div>
    </div>

    <div class="panel tomorrow">
      <div class="panel-head">
        <span class="panel-title">Tomorrow</span>
        <span class="panel-date" id="tomorrow-date"></span>
      </div>
      <div class="col-headers"><span>Prayer</span><span>Begins</span><span>Jamah</span></div>
      <div class="row-list" id="tomorrow-rows"></div>
    </div>
  </div>

  <div class="jumuah-strip" id="jumuah-strip" style="display:none;"></div>

  <p class="status-line" id="status-line"></p>
</div>

<script>
(function(){
  const API_URL = "https://masjid.yamuhammad.org/triolet-al-mahmood-musjid/wp-json/dpt/v1/prayertime?filter=today";

  const el = {
    arch: document.getElementById('arch'),
    columns: document.getElementById('columns'),
    todayDate: document.getElementById('today-date'),
    tomorrowDate: document.getElementById('tomorrow-date'),
    todayRows: document.getElementById('today-rows'),
    tomorrowRows: document.getElementById('tomorrow-rows'),
    jumuah: document.getElementById('jumuah-strip'),
    status: document.getElementById('status-line'),
    errorSlot: document.getElementById('error-slot'),
  };

  let countdownTimer = null;
  let targetTime = null;
  let fetchLock = false;

  const PRAYER_LABELS = {
    fajr: "Fajr",
    sunrise: "Sunrise",
    zuhr: "Zuhr",
    asr: "Asr",
    maghrib: "Maghrib",
    isha: "Isha"
  };

  function fmtTime(t){
    if(!t) return "—";
    const [h,m] = t.split(':');
    let hour = parseInt(h,10);
    const ampm = hour >= 12 ? 'PM' : 'AM';
    hour = hour % 12; if(hour === 0) hour = 12;
    return hour + ':' + m + ' ' + ampm;
  }

  function fmtDateLong(dateStr){
    const d = new Date(dateStr + 'T00:00:00');
    return d.toLocaleDateString(undefined, { weekday:'long', day:'numeric', month:'long' });
  }

  function buildDateTime(dateStr, timeStr){
    return new Date(dateStr + 'T' + timeStr);
  }

  function renderDayRows(container, day, activeKey){
    container.innerHTML = "";

    if(day.is_ramadan === "1" || day.is_ramadan === 1){
      container.appendChild(makeRow("Sehri", null, day.sehri, false, true));
    }

    container.appendChild(makeRow(PRAYER_LABELS.fajr, day.fajr_begins, day.fajr_jamah, activeKey === 'fajr'));
    container.appendChild(makeRow(PRAYER_LABELS.sunrise, day.sunrise, null, activeKey === 'sunrise'));
    container.appendChild(makeRow(PRAYER_LABELS.zuhr, day.zuhr_begins, day.zuhr_jamah, activeKey === 'zuhr'));
    container.appendChild(makeRow(PRAYER_LABELS.asr, day.asr_mithl_1, day.asr_jamah, activeKey === 'asr'));
    container.appendChild(makeRow(PRAYER_LABELS.maghrib, day.maghrib_begins, day.maghrib_jamah, activeKey === 'maghrib'));
    container.appendChild(makeRow(PRAYER_LABELS.isha, day.isha_begins, day.isha_jamah, activeKey === 'isha'));
  }

  function makeRow(name, begins, jamah, active, isSehri){
    const row = document.createElement('div');
    row.className = 'row' + (active ? ' active' : '') + (isSehri ? ' sehri' : '');
    const nameCell = document.createElement('div');
    nameCell.className = 'name';
    nameCell.textContent = name;
    row.appendChild(nameCell);

    const beginsCell = document.createElement('div');
    beginsCell.className = 'time';
    beginsCell.textContent = begins ? fmtTime(begins) : (isSehri ? "" : "—");
    row.appendChild(beginsCell);

    const jamahCell = document.createElement('div');
    jamahCell.className = 'time';
    jamahCell.textContent = jamah ? fmtTime(jamah) : (isSehri ? fmtTime(begins) : "—");
    row.appendChild(jamahCell);

    if(isSehri){
      beginsCell.textContent = "";
      jamahCell.textContent = fmtTime(begins);
    }

    return row;
  }

  function renderJumuah(jumuah){
    if(!jumuah){ el.jumuah.style.display = 'none'; return; }
    const entries = Object.values(jumuah).filter(Boolean);
    if(entries.length === 0){ el.jumuah.style.display = 'none'; return; }
    el.jumuah.innerHTML = "";
    el.jumuah.style.display = 'flex';
    entries.forEach((t, i) => {
      const span = document.createElement('span');
      const label = entries.length > 1 ? ('Jumu\u2019ah ' + (i+1)) : 'Jumu\u2019ah';
      span.innerHTML = '<span class="jl">' + label + '</span>' + fmtTime(t);
      el.jumuah.appendChild(span);
    });
  }

  function render(data){
    el.errorSlot.innerHTML = "";
    el.columns.style.display = 'grid';

    el.todayDate.textContent = fmtDateLong(data.d_date);
    el.tomorrowDate.textContent = fmtDateLong(data.tomorrow.d_date);

    const nextKey = (data.next_prayer && data.next_prayer.prayerName) ? data.next_prayer.prayerName.toLowerCase() : null;

    renderDayRows(el.todayRows, data, nextKey);
    renderDayRows(el.tomorrowRows, data.tomorrow, null);

    renderJumuah(data.jumuah);

    renderHero(data);
  }

  function renderHero(data){
    const np = data.next_prayer;
    if(!np){
      el.arch.innerHTML = '<div class="skeleton">Prayer times unavailable</div>';
      return;
    }

    const label = PRAYER_LABELS[np.prayerName] || np.prayerName;

    // Work out the target datetime for the countdown, handling overnight wrap.
    let target = buildDateTime(data.d_date, np.azanTime);
    const now = new Date();
    if(target.getTime() <= now.getTime()){
      target = buildDateTime(data.tomorrow.d_date, np.azanTime);
    }
    targetTime = target;

    el.arch.innerHTML =
      '<div class="dates">' +
        '<span>' + fmtDateLong(data.d_date) + '</span>' +
        (data.hijri_date_convert ? '<span>' + data.hijri_date_convert + '</span>' : '') +
      '</div>' +
      '<p class="next-label">Next prayer</p>' +
      '<p class="next-name">' + label + '</p>' +
      '<div class="countdown" id="countdown-val">--:--:--<small>time remaining</small></div>' +
      '<div class="azan-iqamah">' +
        '<span>Azan <b>' + fmtTime(np.azanTime) + '</b></span>' +
        '<span>Iqamah <b>' + fmtTime(np.iqamahTime) + '</b></span>' +
      '</div>';

    startCountdown();
  }

  function startCountdown(){
    if(countdownTimer) clearInterval(countdownTimer);
    tickCountdown();
    countdownTimer = setInterval(tickCountdown, 1000);
  }

  function tickCountdown(){
    const valEl = document.getElementById('countdown-val');
    if(!valEl || !targetTime) return;

    const diff = targetTime.getTime() - Date.now();

    if(diff <= 0){
      valEl.innerHTML = "00:00:00<small>time remaining</small>";
      clearInterval(countdownTimer);
      loadData(); // reached zero -> fetch the next set of times
      return;
    }

    const totalSec = Math.floor(diff / 1000);
    const h = Math.floor(totalSec / 3600);
    const m = Math.floor((totalSec % 3600) / 60);
    const s = totalSec % 60;
    const pad = n => String(n).padStart(2,'0');
    valEl.innerHTML = pad(h) + ':' + pad(m) + ':' + pad(s) + '<small>time remaining</small>';
  }

  function showError(message){
    el.errorSlot.innerHTML =
      '<div class="error-box">' + message +
      ' <button id="retry-btn" style="border:none;background:none;color:#7a3a12;font-weight:600;text-decoration:underline;cursor:pointer;">Retry</button></div>';
    document.getElementById('retry-btn').addEventListener('click', loadData);
    el.arch.innerHTML = '<div class="skeleton">Unable to load times</div>';
  }

  function loadData(){
    if(fetchLock) return;
    fetchLock = true;
    el.status.textContent = "Refreshing…";

    fetch(API_URL, { cache: "no-store" })
      .then(res => {
        if(!res.ok) throw new Error("Request failed (" + res.status + ")");
        return res.json();
      })
      .then(json => {
        const data = Array.isArray(json) ? json[0] : json;
        if(!data || !data.next_prayer){
          throw new Error("Unexpected response from the prayer times service.");
        }
        render(data);
        const now = new Date();
        el.status.textContent = "Last updated " + now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
      })
      .catch(err => {
        showError("Couldn't reach the prayer times service. " + (err.message || ""));
        el.status.textContent = "";
      })
      .finally(() => { fetchLock = false; });
  }

  loadData();
})();
</script>
</body>
</html>
